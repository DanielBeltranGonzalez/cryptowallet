services:
  cryptowallet:
    build: .
    container_name: cryptowallet
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - VIEWS_FILE=/data/views.json
      # Optionally override the public Solana RPC (recommended for production):
      # - SOLANA_RPC_URL=https://your-rpc-endpoint
    volumes:
      - views_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  views_data:
